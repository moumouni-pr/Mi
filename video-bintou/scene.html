<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
body{font-family:Inter,'DejaVu Sans',sans-serif;color:#1f2a44}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform}
.cap{position:absolute;left:60px;right:60px;top:110px;min-height:250px;background:#fff;border-radius:34px;
 box-shadow:0 14px 0 rgba(31,42,68,.08),0 4px 30px rgba(31,42,68,.10);padding:38px 46px;display:flex;align-items:center;justify-content:center;text-align:center}
.cap p{font-size:54px;font-weight:800;line-height:1.22;letter-spacing:-.5px}
.cap .k1{color:#f08a24}.cap .k2{color:#1aa37a}.cap .k3{color:#e5484d}.cap .k4{color:#5b5bd6}
.w{display:inline-block;transition:none}
.badge{position:absolute;padding:16px 34px;border-radius:999px;font-weight:800;font-size:44px;color:#fff;white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.card{position:absolute;background:#fff;border-radius:30px;box-shadow:0 10px 0 rgba(31,42,68,.08),0 4px 24px rgba(31,42,68,.12);padding:30px 36px}
.brand{position:absolute;left:60px;top:44px;font-size:30px;font-weight:800;letter-spacing:1px;color:#1f2a44;opacity:.75}
.brand b{color:#f08a24}
.bar{position:absolute;left:0;top:0;height:10px;background:#f08a24}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- timing helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,t0,d=.45)=>clamp((t-t0)/d);
// pop-in scale + fade for an element that appears at t0 (and optionally leaves at t1)
function pop(t,t0,t1=1e9,d=.45){const i=prog(t,t0,d),o=1-prog(t,t1,.3);return {s:i<=0?0:back(i)*(o<1?lerp(.6,1,o):1),o:Math.min(clamp(i*2.5),o)}}
function rise(t,t0,t1=1e9,dist=60,d=.5){const i=eOut(prog(t,t0,d)),o=1-prog(t,t1,.3);return {y:(1-i)*dist,o:Math.min(i,o)}}
// absolute placed element: center at (x,y)
function at(x,y,html,{s=1,o=1,r=0,w=null,ty=0,tx=0}={}){if(o<=0.001)return '';
 return `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) translate(${tx}px,${ty}px) rotate(${r}deg) scale(${s});opacity:${o};${w?`width:${w}px;`:''}">${html}</div>`}

// ---------- palette ----------
const C={ink:'#1f2a44',orange:'#f08a24',green:'#1aa37a',red:'#e5484d',violet:'#5b5bd6',blue:'#3b82f6',skin:'#7a4a2b',skinD:'#5e361d',yellow:'#ffc83d'};

// ---------- characters ----------
// pose: arms angles in degrees (0 = straight down, positive = outward), elbow-less arms
// mood: smile | big | sad | worried | surprised | neutral | talk
function person(o={}){
 const p=Object.assign({skin:C.skin,shirt:'#1aa37a',shirt2:'#14805f',pants:'#2b3a67',hair:'#1b1b1b',shoes:'#20263a',
   la:12,ra:-12,mood:'smile',blink:false,talk:0,kind:'man',look:0,item:'',vest:false,tie:false,glasses:false,grey:false,wrap:'',badge:false},o);
 const eyeY=48, ex=p.look*3;
 const eyes=p.blink?`<path d="M-22 ${eyeY} h12 M10 ${eyeY} h12" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>`:
  `<ellipse cx="-16" cy="${eyeY}" rx="9" ry="${p.mood==='surprised'?12:10}" fill="#fff"/><ellipse cx="16" cy="${eyeY}" rx="9" ry="${p.mood==='surprised'?12:10}" fill="#fff"/>
   <circle cx="${-15+ex}" cy="${eyeY+1}" r="5.2" fill="#1b1b1b"/><circle cx="${17+ex}" cy="${eyeY+1}" r="5.2" fill="#1b1b1b"/>
   <circle cx="${-13+ex}" cy="${eyeY-1}" r="1.8" fill="#fff"/><circle cx="${19+ex}" cy="${eyeY-1}" r="1.8" fill="#fff"/>`;
 const brows={sad:`<path d="M-26 32 L-8 28 M26 32 L8 28" stroke="#1b1b1b" stroke-width="4.5" stroke-linecap="round"/>`,
  worried:`<path d="M-26 30 L-8 34 M26 30 L8 34" stroke="#1b1b1b" stroke-width="4.5" stroke-linecap="round" transform="scale(1,-1) translate(0,-64)"/>`,
  surprised:`<path d="M-25 26 Q-16 19 -7 26 M25 26 Q16 19 7 26" stroke="#1b1b1b" stroke-width="4.5" fill="none" stroke-linecap="round"/>`}[p.mood]||
  `<path d="M-25 31 Q-16 26 -7 31 M25 31 Q16 26 7 31" stroke="#1b1b1b" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
 let mouth;
 if(p.talk>0){const h=4+p.talk*12;mouth=`<ellipse cx="0" cy="72" rx="9" ry="${h/2}" fill="#5a1e1e"/>`}
 else mouth={smile:`<path d="M-12 68 Q0 79 12 68" stroke="#3a1a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  big:`<path d="M-15 66 Q0 86 15 66 Z" fill="#5a1e1e"/><path d="M-11 67 Q0 71 11 67" stroke="#fff" stroke-width="4" fill="none"/>`,
  sad:`<path d="M-11 76 Q0 67 11 76" stroke="#3a1a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  worried:`<path d="M-11 74 Q-5 70 0 74 Q5 78 11 73" stroke="#3a1a10" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
  surprised:`<ellipse cx="0" cy="73" rx="8" ry="10" fill="#5a1e1e"/>`,
  neutral:`<path d="M-9 71 H9" stroke="#3a1a10" stroke-width="4.5" stroke-linecap="round"/>`}[p.mood]||'';
 let hair;
 if(p.kind==='woman'){hair=`<path d="M-50 40 Q-56 -12 0 -16 Q56 -12 50 40 Q46 6 0 4 Q-46 6 -50 40Z" fill="${p.wrap||'#8b3fd1'}"/>
   <path d="M-46 8 Q0 -40 46 8 Q30 -6 0 -4 Q-30 -6 -46 8Z" fill="${p.wrap||'#8b3fd1'}"/><circle cx="38" cy="-6" r="16" fill="${p.wrap||'#8b3fd1'}"/>`}
 else if(p.grey){hair=`<path d="M-44 30 Q-46 -6 0 -8 Q46 -6 44 30 Q38 14 26 12 Q0 4 -26 12 Q-38 14 -44 30Z" fill="#cfd3dc"/>`}
 else hair=`<path d="M-44 34 Q-48 -10 0 -10 Q48 -10 44 34 Q42 14 30 12 Q0 2 -30 12 Q-42 14 -44 34Z" fill="${p.hair}"/>`;
 const glasses=p.glasses?`<g fill="none" stroke="#1f2a44" stroke-width="3.5"><circle cx="-16" cy="${eyeY}" r="14"/><circle cx="16" cy="${eyeY}" r="14"/><path d="M-2 ${eyeY} h4"/></g>`:'';
 const arm=(side,ang,color)=>{const sx=side*(p.kind==='woman'?46:42);return `<g transform="translate(${sx} 118) rotate(${-side*ang})">
   <rect x="-12" y="-8" width="24" height="96" rx="12" fill="${color}"/><circle cx="0" cy="92" r="13" fill="${p.skin}"/></g>`};
 const torso=p.kind==='woman'
  ?`<path d="M-44 110 Q-46 100 -34 98 L34 98 Q46 100 44 110 L58 250 Q0 262 -58 250Z" fill="${p.shirt}"/>
    <path d="M-50 170 Q0 182 50 170 L53 192 Q0 204 -53 192Z" fill="${p.shirt2}" opacity=".7"/>`
  :`<rect x="-46" y="98" width="92" height="112" rx="22" fill="${p.shirt}"/>
    <path d="M-14 98 L0 116 L14 98Z" fill="${p.shirt2}"/>`;
 const vest=p.vest?`<path d="M-46 112 Q-46 98 -30 98 L-12 98 L-12 210 L-46 210Z M46 112 Q46 98 30 98 L12 98 L12 210 L46 210Z" fill="#ff8a1f"/>
   <rect x="-46" y="168" width="34" height="9" fill="#ffe28a"/><rect x="12" y="168" width="34" height="9" fill="#ffe28a"/>`:'';
 const tie=p.tie?`<path d="M0 104 L-8 116 L0 170 L8 116Z" fill="${C.red}"/><path d="M-26 98 L0 128 L26 98" fill="none" stroke="#fff" stroke-width="5"/>`:'';
 const badge=p.badge?`<rect x="18" y="128" width="20" height="26" rx="4" fill="#fff"/><rect x="21" y="134" width="14" height="4" fill="${C.blue}"/>`:'';
 const legs=p.kind==='woman'?`<rect x="-26" y="246" width="20" height="38" rx="9" fill="${p.skin}"/><rect x="6" y="246" width="20" height="38" rx="9" fill="${p.skin}"/>`
   :`<rect x="-36" y="200" width="32" height="88" rx="12" fill="${p.pants}"/><rect x="4" y="200" width="32" height="88" rx="12" fill="${p.pants}"/>`;
 return `<svg width="360" height="510" viewBox="-120 -30 240 340" overflow="visible">
  <ellipse cx="0" cy="300" rx="70" ry="12" fill="rgba(31,42,68,.12)"/>
  ${legs}
  <ellipse cx="-22" cy="292" rx="24" ry="11" fill="${p.shoes}"/><ellipse cx="22" cy="292" rx="24" ry="11" fill="${p.shoes}"/>
  ${p.kind==='woman'?'':arm(-1,p.la,p.shirt2)+arm(1,p.ra,p.shirt2)}
  ${torso}${vest}${tie}${badge}
  ${p.kind==='woman'?arm(-1,p.la,p.shirt2)+arm(1,p.ra,p.shirt2):''}
  <rect x="-12" y="84" width="24" height="20" fill="${p.skinD||C.skinD}"/>
  <ellipse cx="-45" cy="50" rx="8" ry="11" fill="${p.skin}"/><ellipse cx="45" cy="50" rx="8" ry="11" fill="${p.skin}"/>
  <ellipse cx="0" cy="44" rx="46" ry="50" fill="${p.skin}"/>
  ${hair}${brows}${eyes}${glasses}
  <ellipse cx="0" cy="60" rx="6" ry="4" fill="${C.skinD}" opacity=".6"/>
  ${mouth}
 </svg>`}
const blinkAt=(t,seed=0)=>((t+seed)%3.7)<0.12;
const IB=(t,o={})=>person(Object.assign({shirt:'#2f7de1',shirt2:'#2363b8',pants:'#2b3a67',badge:true,blink:blinkAt(t)},o));
const MOM=(t,o={})=>person(Object.assign({kind:'woman',shirt:'#e5484d',shirt2:'#ffc83d',wrap:'#ffc83d',skin:'#6e4024',blink:blinkAt(t,1.3)},o));
const DIALLO=(t,o={})=>person(Object.assign({shirt:'#4b5563',shirt2:'#374151',pants:'#374151',tie:true,glasses:true,grey:true,skin:'#5f3a22',blink:blinkAt(t,2.1)},o));
const COLL=(t,o={})=>person(Object.assign({shirt:'#1aa37a',shirt2:'#14805f',pants:'#3b3b4f',vest:true,blink:blinkAt(t,.7),hair:'#2a1a10'},o));

// ---------- icons ----------
const I={
 phone:(c='#1f2a44')=>`<svg width="120" height="190" viewBox="0 0 60 95"><rect x="2" y="2" width="56" height="91" rx="10" fill="${c}"/><rect x="7" y="11" width="46" height="68" rx="4" fill="#9fd3ff"/><circle cx="30" cy="86" r="3.5" fill="#fff"/></svg>`,
 shirt:(c='#e5484d')=>`<svg width="170" height="150" viewBox="0 0 68 60"><path d="M22 2 L8 8 L0 22 L12 27 L14 22 L14 58 L54 58 L54 22 L56 27 L68 22 L60 8 L46 2 Q34 12 22 2Z" fill="${c}"/></svg>`,
 party:()=>`<svg width="170" height="170" viewBox="0 0 68 68"><path d="M6 62 L24 14 L54 44Z" fill="${C.violet}"/><path d="M14 40 L34 34 M10 52 L42 44" stroke="#ffc83d" stroke-width="4"/><circle cx="46" cy="10" r="4" fill="${C.orange}"/><circle cx="60" cy="24" r="4" fill="${C.green}"/><circle cx="36" cy="6" r="3" fill="${C.red}"/><path d="M50 30 Q60 30 62 38" stroke="${C.red}" stroke-width="3" fill="none"/></svg>`,
 house:()=>`<svg width="230" height="210" viewBox="0 0 92 84"><path d="M6 40 L46 6 L86 40Z" fill="${C.orange}"/><rect x="14" y="38" width="64" height="44" fill="#fff4e3"/><rect x="38" y="54" width="16" height="28" rx="2" fill="#8a5a3b"/><rect x="20" y="46" width="12" height="12" fill="#9fd3ff"/><rect x="60" y="46" width="12" height="12" fill="#9fd3ff"/></svg>`,
 bill:(txt,c=C.red)=>`<div class="card" style="position:relative;width:640px;padding:34px 40px;text-align:left"><div style="font-size:28px;font-weight:700;color:#7a8299;letter-spacing:2px">FACTURE MÉDICALE</div><div style="height:4px;background:#eef0f5;margin:16px 0"></div><div style="font-size:30px;color:#7a8299;font-weight:600">Soins urgents</div><div style="font-size:66px;font-weight:900;color:${c};white-space:nowrap">${txt}</div></div>`,
 wallet:(open=0)=>`<svg width="230" height="180" viewBox="0 0 92 72"><rect x="4" y="14" width="84" height="54" rx="10" fill="#8a5a3b"/><rect x="4" y="8" width="70" height="20" rx="8" fill="#a8714b" transform="rotate(${-open*14} 4 28)"/><rect x="58" y="32" width="30" height="20" rx="6" fill="#6e4024"/><circle cx="70" cy="42" r="4" fill="#ffc83d"/></svg>`,
 coin:(s=1)=>`<svg width="${70*s}" height="${70*s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#ffc83d"/><circle cx="20" cy="20" r="13" fill="none" stroke="#e8a317" stroke-width="3"/><text x="20" y="26" font-size="15" font-weight="900" text-anchor="middle" fill="#c27c0e" font-family="Inter">F</text></svg>`,
 bills:()=>`<svg width="150" height="100" viewBox="0 0 75 50"><rect x="6" y="6" width="66" height="40" rx="5" fill="#4caf7d" transform="rotate(-8 39 26)"/><rect x="3" y="4" width="66" height="40" rx="5" fill="#5cc48d"/><circle cx="36" cy="24" r="10" fill="#3e9b6a"/></svg>`,
 hospital:()=>`<svg width="300" height="260" viewBox="0 0 120 104"><rect x="10" y="20" width="100" height="84" rx="6" fill="#fff"/><rect x="10" y="20" width="100" height="16" rx="6" fill="#dfe6f3"/><rect x="48" y="44" width="24" height="60" fill="#cfe3ff"/><rect x="22" y="48" width="18" height="16" fill="#9fd3ff"/><rect x="80" y="48" width="18" height="16" fill="#9fd3ff"/><rect x="50" y="2" width="20" height="36" rx="3" fill="${C.red}"/><rect x="42" y="10" width="36" height="20" rx="3" fill="${C.red}"/></svg>`,
 notebook:()=>`<svg width="260" height="320" viewBox="0 0 65 80"><rect x="4" y="2" width="58" height="76" rx="6" fill="#fff" stroke="#dfe3ec" stroke-width="2"/><rect x="4" y="2" width="10" height="76" rx="4" fill="${C.orange}"/>${[18,28,38,48,58,68].map(y=>`<rect x="20" y="${y}" width="${30+(y%20)}" height="3" rx="1.5" fill="#cfd5e3"/>`).join('')}</svg>`,
 piggy:(fill=0)=>`<svg width="320" height="260" viewBox="0 0 120 98"><defs><clipPath id="pg"><ellipse cx="58" cy="54" rx="46" ry="36"/></clipPath></defs><ellipse cx="58" cy="54" rx="46" ry="36" fill="#ffb3c7"/><rect x="0" y="${90-72*fill}" width="120" height="100" fill="#ff8fb0" clip-path="url(#pg)"/><circle cx="96" cy="50" r="12" fill="#ffb3c7"/><circle cx="94" cy="48" r="2" fill="#a14a65"/><circle cx="99" cy="48" r="2" fill="#a14a65"/><circle cx="80" cy="40" r="3.5" fill="#1f2a44"/><path d="M40 20 L48 10 L54 22Z" fill="#ff8fb0"/><rect x="36" y="84" width="10" height="14" rx="4" fill="#ff8fb0"/><rect x="70" y="84" width="10" height="14" rx="4" fill="#ff8fb0"/><rect x="48" y="20" width="22" height="5" rx="2.5" fill="#a14a65"/></svg>`,
 calendar:(n)=>`<svg width="240" height="240" viewBox="0 0 60 60"><rect x="4" y="8" width="52" height="48" rx="8" fill="#fff" stroke="#dfe3ec" stroke-width="2"/><rect x="4" y="8" width="52" height="14" rx="6" fill="${C.red}"/><rect x="16" y="3" width="5" height="11" rx="2.5" fill="#1f2a44"/><rect x="39" y="3" width="5" height="11" rx="2.5" fill="#1f2a44"/><text x="30" y="49" font-size="24" font-weight="900" text-anchor="middle" fill="#1f2a44" font-family="Inter">${n}</text></svg>`,
 bubble:(c=C.blue)=>`<svg width="200" height="170" viewBox="0 0 80 68"><path d="M8 6 H72 Q78 6 78 12 V44 Q78 50 72 50 H34 L18 64 L20 50 H8 Q2 50 2 44 V12 Q2 6 8 6Z" fill="${c}"/><circle cx="24" cy="28" r="4.5" fill="#fff"/><circle cx="40" cy="28" r="4.5" fill="#fff"/><circle cx="56" cy="28" r="4.5" fill="#fff"/></svg>`,
 share:()=>`<svg width="180" height="180" viewBox="0 0 70 70"><circle cx="35" cy="35" r="33" fill="${C.green}"/><path d="M20 46 Q22 28 42 26 V18 L56 32 L42 46 V38 Q30 36 20 46Z" fill="#fff"/></svg>`,
 heart:()=>`<svg width="120" height="110" viewBox="0 0 48 44"><path d="M24 42 L6 24 Q-2 14 6 6 Q14 -1 24 9 Q34 -1 42 6 Q50 14 42 24Z" fill="${C.red}"/></svg>`,
 check:(c=C.green)=>`<svg width="70" height="70" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${c}"/><path d="M11 21 L18 28 L30 13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 cross:()=>`<svg width="70" height="70" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${C.red}"/><path d="M13 13 L27 27 M27 13 L13 27" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`,
 bed:()=>`<svg width="460" height="230" viewBox="0 0 184 92"><rect x="6" y="40" width="172" height="26" rx="8" fill="#dfe6f3"/><rect x="10" y="20" width="16" height="66" rx="6" fill="#8a9bb8"/><rect x="160" y="34" width="14" height="52" rx="6" fill="#8a9bb8"/><rect x="26" y="30" width="44" height="20" rx="10" fill="#fff"/><rect x="60" y="34" width="104" height="22" rx="10" fill="#9fd3ff"/></svg>`,
 box:()=>`<svg width="130" height="120" viewBox="0 0 52 48"><rect x="2" y="8" width="48" height="38" rx="3" fill="#d9a066"/><rect x="2" y="8" width="48" height="10" fill="#c48a52"/><rect x="21" y="8" width="10" height="16" fill="#f1d3a8"/></svg>`,
 scale:(tilt)=>`<svg width="520" height="360" viewBox="0 0 208 144"><rect x="100" y="20" width="8" height="112" fill="#1f2a44"/><rect x="70" y="128" width="68" height="10" rx="5" fill="#1f2a44"/><g transform="rotate(${tilt} 104 24)"><rect x="14" y="20" width="180" height="8" rx="4" fill="#1f2a44"/><path d="M24 28 L8 70 H52Z" fill="none" stroke="#1f2a44" stroke-width="2"/><path d="M184 28 L168 70 H212Z" fill="none" stroke="#1f2a44" stroke-width="2"/><path d="M6 70 H54 Q50 84 30 84 Q10 84 6 70Z" fill="${C.orange}"/><path d="M166 70 H214 Q210 84 190 84 Q170 84 166 70Z" fill="${C.green}"/></g><circle cx="104" cy="22" r="8" fill="${C.orange}"/></svg>`,
};
function badge(txt,bg,{fs=44}={}){return `<div class="badge" style="position:relative;background:${bg};font-size:${fs}px">${txt}</div>`}
function chip(txt,bg='#fff',col=C.ink,fs=34){return `<div style="background:${bg};color:${col};font-weight:800;font-size:${fs}px;padding:14px 28px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 0 rgba(31,42,68,.08),0 2px 14px rgba(31,42,68,.1)">${txt}</div>`}
function bigNum(txt,col,sub=''){return `<div class="card" style="position:relative;text-align:center;padding:30px 50px"><div style="font-size:96px;font-weight:900;color:${col};letter-spacing:-2px;white-space:nowrap">${txt}</div>${sub?`<div style="font-size:32px;font-weight:700;color:#7a8299">${sub}</div>`:''}</div>`}

// ---------- backgrounds ----------
function bg(t,top,bot,ground,{sun=false,clouds=true,dark=0,city=false,rain=0}={}){
 let h=`<div class="abs" style="width:1080px;height:1920px;background:linear-gradient(${top},${bot})"></div>`;
 if(sun)h+=at(860,560,`<div style="width:130px;height:130px;border-radius:50%;background:${C.yellow};box-shadow:0 0 0 26px rgba(255,200,61,.25)"></div>`);
 if(city){const b=[[60,300,170],[230,420,130],[360,260,150],[520,380,120],[640,320,170],[810,450,130],[940,300,160]];
  h+=b.map(([x,hh,w],i)=>`<div class="abs" style="left:${x}px;top:${1500-hh}px;width:${w}px;height:${hh}px;background:rgba(31,42,68,${.07+i%2*.03});border-radius:14px 14px 0 0"></div>`).join('');
  h+=`<div class="abs" style="left:450px;top:1240px;width:150px;height:150px;border-radius:75px 75px 0 0;background:rgba(31,42,68,.1)"></div><div class="abs" style="left:518px;top:1150px;width:14px;height:100px;background:rgba(31,42,68,.1)"></div>`}
 if(clouds){[[0,520,1],[1,700,.8],[2,620,1.15]].forEach(([i,y,s])=>{const x=((t*18*(1+i*.3)+i*420)%1400)-200;
  h+=at(x,y,`<svg width="${220*s}" height="${100*s}" viewBox="0 0 110 50"><path d="M20 46 Q2 46 4 32 Q6 20 22 22 Q26 4 48 6 Q66 0 74 18 Q96 14 100 32 Q104 46 86 46Z" fill="${dark>0?'#c6ccd8':'#fff'}" opacity=".95"/></svg>`)})}
 h+=`<div class="abs" style="top:1500px;width:1080px;height:420px;background:${ground}"></div>`;
 if(rain>0){for(let i=0;i<40;i++){const x=(i*97)%1080,y=((t*900+i*211)%1100)+500;h+=`<div class="abs" style="left:${x}px;top:${y}px;width:4px;height:34px;border-radius:2px;background:rgba(80,110,170,${.35*rain})"></div>`}}
 if(dark>0)h+=`<div class="abs" style="width:1080px;height:1920px;background:rgba(31,42,68,${dark*.25})"></div>`;
 return h}

// ---------- captions ----------
const SEGS=[

const CHUNKS=[];
(function(){for(const [s,e,txt] of SEGS){
  const words=[];let cls='';
  for(const raw of txt.split(' ')){let w=raw,c=cls;
    const mk={'*':'k1','#':'k2','~':'k3','@':'k4'};
    for(const m in mk){ if(w.startsWith(m)){cls=mk[m];c=cls;w=w.slice(1)} }
    let end=false;for(const m in mk){ if(w.includes(m)){w=w.replace(m,'');end=true} }
    words.push({w,c});if(end)cls='';}
  // chunk ~ <= 42 chars
  const groups=[];let g=[],len=0;
  words.forEach((wd,i)=>{g.push(wd);len+=wd.w.length+1;const last=i===words.length-1;
    const brk=/[.!?:,…]$/.test(wd.w)&&len>18;
    if(len>40||brk||last){groups.push(g);g=[];len=0}});
  const total=groups.reduce((a,g)=>a+g.reduce((b,w)=>b+w.w.length+1,0),0);
  let cur=s;for(const g of groups){const l=g.reduce((b,w)=>b+w.w.length+1,0);const d=(e-s)*l/total;
    let wc=cur;const ws=g.map(w=>{const wd=(d*(w.w.length+1)/l);const o={...w,t:wc};wc+=wd;return o});
    CHUNKS.push({s:cur,e:cur+d,ws});cur+=d}
}})();
function caption(t){let c=null;for(const k of CHUNKS){if(t>=k.s-0.05)c=k;else break}
 if(!c)return '';
 // keep showing last chunk through short pauses (<1.2s), hide during long gaps
 if(t>c.e+1.2)return '';
 const html=c.ws.map(w=>{const a=clamp((t-w.t)/0.12);return `<span class="w ${w.c}" style="opacity:${0.18+0.82*a};transform:translateY(${(1-a)*8}px)">${w.w}</span>`}).join(' ');
 const ap=eOut(clamp((t-c.s+0.05)/0.2));
 return `<div class="cap" style="transform:scale(${0.96+0.04*ap})"><p>${html}</p></div>`}

function render(t){
 let h='';
 for(let i=0;i<SCENES.length;i++){const sc=SCENES[i];if(t>=sc.s&&t<sc.e){
   h+=sc.f(t);
   // scene transition: quick white wipe in
   const k=clamp((t-sc.s)/0.35);if(i>0&&k<1)h+=`<div class="abs" style="width:1080px;height:1920px;background:#fff;opacity:${1-eOut(k)}"></div>`;
 }}
 h+=caption(t);
 h+=`<div class="brand">MOTION <b>POUR TOUS</b></div>`;
 h+=`<div class="bar" style="width:${clamp(t/127.1)*1080}px"></div>`;
 document.getElementById('stage').innerHTML=h;
}
window.render=render;render(0);
