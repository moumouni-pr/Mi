<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#ece0cb}
body{font-family:Inter,'DejaVu Sans',sans-serif;color:#1f160f}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.card{background:#fff;border-radius:26px;box-shadow:0 10px 0 rgba(31,42,68,.06),0 4px 24px rgba(31,42,68,.10);padding:26px 34px}
.chip{display:inline-block;font-weight:800;border-radius:999px;padding:12px 26px;white-space:nowrap;box-shadow:0 5px 0 rgba(31,42,68,.07),0 2px 12px rgba(31,42,68,.1)}
.badge{display:inline-flex;align-items:center;gap:14px;background:#377e73;color:#fff;font-weight:900;border-radius:999px;padding:14px 34px;white-space:nowrap}
.badge i{font-style:normal;width:48px;height:48px;border-radius:50%;background:#d49700;color:#1f160f;display:flex;align-items:center;justify-content:center}
.title{font-weight:900;text-align:center;line-height:1.1;letter-spacing:-1px}
.hl{color:#d49700}
.cap{position:absolute;left:760px;right:60px;top:915px;text-align:center;font-size:46px;font-weight:800;line-height:1.25;color:#1f160f}
.cap .w{display:inline-block}
.cap .k{color:#d49700}
.cap .r{color:#be5340}
.brand{position:absolute;left:44px;top:30px;font-size:26px;font-weight:900;letter-spacing:1px}
.brand b{color:#d49700}
.bar{position:absolute;left:0;top:0;height:8px;background:#d49700}
</style></head>
<body><div id="stage"></div><div id="pres" class="abs" style="width:340px;transform-origin:50% 100%"><div style="position:absolute;left:-30px;right:-30px;bottom:-14px;height:34px;border-radius:50%;background:rgba(31,42,68,.12)"></div><img src="presentateur.png" style="width:340px;display:block;position:relative"></div><div id="over" class="abs" style="width:1920px;height:1080px"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,t0,d=.45)=>clamp((t-t0)/d);
function pop(t,t0,t1=1e9,d=.45){const i=prog(t,t0,d),o=1-prog(t,t1,.3);return {s:i<=0?0:back(i)*(o<1?lerp(.6,1,o):1),o:Math.min(clamp(i*2.5),o)}}
function rise(t,t0,t1=1e9,dist=50,d=.5){const i=eOut(prog(t,t0,d)),o=1-prog(t,t1,.3);return {ty:(1-i)*dist,o:Math.min(i,o)}}
function at(x,y,html,{s=1,o=1,r=0,ty=0,tx=0}={}){if(o<=0.001)return '';
 return `<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) translate(${tx}px,${ty}px) rotate(${r}deg) scale(${s});opacity:${o}">${html}</div>`}
const C={ink:'#1f160f',orange:'#d49700',amber:'#d49700',green:'#377e73',red:'#be5340',violet:'#2e3b63',blue:'#2e3b63',teal:'#377e73'};
const chip=(txt,bg='#fff',col=C.ink,fs=34)=>`<span class="chip" style="background:${bg};color:${col};font-size:${fs}px">${txt}</span>`;
const badge=(n,txt,fs=34)=>`<span class="badge" style="font-size:${fs}px">${n?`<i>${n}</i>`:''}${txt}</span>`;
const check=(c=C.green)=>`<svg width="52" height="52" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${c}"/><path d="M11 21 L18 28 L30 13" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const cross=()=>`<svg width="52" height="52" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="${C.red}"/><path d="M13 13 L27 27 M27 13 L13 27" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>`;
function line(t,ti,txt,mark){const a=pop(t,ti);return `<div style="display:flex;align-items:center;justify-content:space-between;gap:24px;margin:12px 0;opacity:${a.o}"><span style="font-size:38px;font-weight:800">${txt}</span><span style="display:inline-block;transform:scale(${a.s})">${mark===true?check():mark===false?cross():`<span style="font-size:46px">${mark}</span>`}</span></div>`}
const card=(title,inner,w=760)=>`<div class="card" style="width:${w}px;text-align:left">${title?`<div style="font-size:24px;font-weight:800;color:#8a7a66;letter-spacing:2px;margin-bottom:6px">${title}</div>`:''}${inner}</div>`;
const big=(txt,col=C.ink,fs=96)=>`<div class="title" style="font-size:${fs}px;color:${col};white-space:nowrap">${txt}</div>`;
const emo=(e,fs=120)=>`<div style="font-size:${fs}px;line-height:1">${e}</div>`;
function confetti(t,t0,cx=1310,cy=420){let h='';for(let i=0;i<20;i++){const p=prog(t,t0,2.4);if(p>0&&p<1)h+=at(cx+Math.cos(i*1.9)*p*600,cy+Math.sin(i*2.7)*p*250+p*p*520,`<div style="width:22px;height:12px;background:${[C.orange,C.green,C.violet,C.red][i%4]};border-radius:3px"></div>`,{r:i*40+t*300,o:1-p})}return h}
function counter(t,t0,d,to,suf=' F CFA'){return Math.round(to*eOut(prog(t,t0,d))).toLocaleString('fr-FR')+suf}

// ---------- captions ----------
const SEGS=[
[0.00,2.71,"~TES ÉTUDES NE TE GARANTISSENT PAS~ FORCÉMENT UN EMPLOI !"],
[3.53,4.80,"Voici l'histoire de *Moustapha*."],
[5.29,7.47,"*Moustapha* est étudiant en *première année de droit*."],
[7.81,9.84,"Mais contrairement à beaucoup de ses camarades,"],
[10.15,12.03,"il ne mise pas *uniquement* sur ses études."],
[12.45,14.81,"Parallèlement à ses cours, il nourrit une *autre passion* :"],
[15.24,16.04,"*l'informatique*."],
[16.42,19.27,"Sur *YouTube*, il passe des heures à suivre des *tutoriels*."],
[19.63,24.22,"Il *démonte* de vieux appareils, cherche à *comprendre* leur fonctionnement, puis essaie de les *remonter*."],
[24.68,26.66,"Au début, ce n'est qu'une simple *curiosité*."],
[27.00,30.26,"Mais progressivement, il devient le *génie informatique* de la maison."],
[30.60,35.24,"Téléphones, ordinateurs et autres appareils en panne ? C'est désormais à *Moustapha* qu'on fait appel !"],
[35.65,36.92,"Mais il ne compte pas *s'arrêter là*."],
[37.25,41.08,"Avec l'arrivée de *l'intelligence artificielle*, il découvre de nouvelles possibilités."],
[41.41,46.52,"Il apprend, expérimente et finit par développer son premier *logiciel de gestion* pour un restaurant."],
[46.85,51.65,"Et devine quoi ? Le restaurant accepte de payer *150 000 F CFA* pour son travail !"],
[52.05,55.48,"Fier de cette première réussite, *Moustapha* ne se repose pas sur ses acquis."],
[55.81,58.39,"Il continue d'apprendre et d'améliorer ses *compétences*."],
[58.76,62.45,"Quelques semaines plus tard, le même restaurant le sollicite pour créer son *site web*."],
[62.79,64.90,"Il relève encore le défi avec *succès*."],
[65.25,69.29,"Grâce au *bouche-à-oreille*, ses services commencent à être recommandés auprès d'autres entreprises."],
[69.66,73.20,"En seulement trois mois, *Moustapha* réussit à fidéliser *15 clients*."],
[73.60,81.65,"Mais un jour, il rencontre un client qui ~refuse de payer~ sa prestation, pensant probablement avoir affaire à un jeune inexpérimenté qu'il pourrait facilement ~intimider~."],
[81.98,85.28,"Ce que ce client ignore, c'est que *Moustapha* étudie le *droit* !"],
[85.59,89.50,"Il rassemble ses *preuves*, engage les *démarches nécessaires* et obtient *gain de cause*."],
[89.80,92.53,"Il récupère son argent et obtient même une *indemnisation*."],
[92.92,98.16,"Un an après ses débuts, *Moustapha* ouvre sa *première entreprise* dans un local de seulement *10 m²*."],
[98.49,102.61,"Ce n'est peut-être pas un grand bureau, mais c'est le début d'une *grande aventure*."]];
const CHUNKS=[];
(function(){for(const [s,e,txt] of SEGS){const words=[];let cls='';
  for(const raw of txt.split(' ')){let w=raw,c=cls;const mk={'*':'k','~':'r'};
    for(const m in mk){if(w.startsWith(m)){cls=mk[m];c=cls;w=w.slice(1)}}
    let end=false;for(const m in mk){if(w.includes(m)){w=w.replace(m,'');end=true}}
    words.push({w,c});if(end)cls=''}
  const groups=[];let g=[],len=0;
  words.forEach((wd,i)=>{g.push(wd);len+=wd.w.length+1;const last=i===words.length-1;const brk=/[.!?:,…]$/.test(wd.w)&&len>22;
    if(len>50||brk||last){groups.push(g);g=[];len=0}});
  const total=groups.reduce((a,g)=>a+g.reduce((b,w)=>b+w.w.length+1,0),0);
  let cur=s;for(const g of groups){const l=g.reduce((b,w)=>b+w.w.length+1,0);const d=(e-s)*l/total;let wc=cur;
    const ws=g.map(w=>{const wd=d*(w.w.length+1)/l;const o={...w,t:wc};wc+=wd;return o});CHUNKS.push({s:cur,e:cur+d,ws});cur+=d}}})();
function wt(word,after=0){for(const c of CHUNKS)for(const w of c.ws){if(w.t>=after&&w.w.toLowerCase().replace(/[^a-z0-9à-ÿ'²-]/g,'').startsWith(word.toLowerCase()))return w.t}return after}
function caption(t){let c=null;for(const k of CHUNKS){if(t>=k.s-0.05)c=k;else break}
 if(!c||t>c.e+1.2)return '';
 // merge consecutive same-class words into one highlight span
 let html='',i=0;const ws=c.ws;
 while(i<ws.length){const cl=ws[i].c;let j=i;const parts=[];while(j<ws.length&&ws[j].c===cl&&(cl||j===i)){parts.push(ws[j]);j++;if(!cl)break}
   const inner=parts.map(w=>{const a=clamp((t-w.t)/0.12);return `<span style="opacity:${0.25+0.75*a}">${w.w}</span>`}).join(' ');
   html+=(cl?`<span class="w ${cl}">${inner}</span>`:inner)+' ';i=j}
 return `<div class="cap">${html}</div>`}

// ---------- presenter ----------
// emotion timeline (from the voice-over tone tags and story beats)
const EMO=[
 [0.0,3.4,'serious'],[16.4,26.6,'thinking'],[27.0,30.3,'proud'],[33.0,35.3,'excited'],
 [37.2,41.0,'thinking'],[46.8,48.9,'surprised'],[48.9,52.0,'excited'],[52.0,55.5,'proud'],
 [62.8,64.9,'happy'],[69.6,73.3,'happy'],[73.6,81.7,'angry'],[81.9,85.4,'laugh'],[89.8,92.6,'happy'],[98.4,103,'excited']];
const EMOJI={serious:'⚠️',thinking:'🤔',proud:'😎',excited:'🤩',surprised:'😮',happy:'😄',angry:'😠',laugh:'😂'};
const AURA={serious:'190,83,64',thinking:'46,59,99',proud:'212,151,0',excited:'212,151,0',surprised:'55,126,115',happy:'55,126,115',angry:'190,83,64',laugh:'212,151,0'};
function emoAt(t){for(const e of EMO)if(t>=e[0]&&t<e[1])return e;return null}
function presenter(t){
 const e=emoAt(t),k=e?t-e[0]:0,type=e?e[2]:'',inn=e?eOut(clamp(k/.35))*(1-eOut(clamp((t-(e[1]-.35))/.35))):0;
 let tx=0,ty=Math.sin(t*1.6)*4,rot=0,sx=1,sy=1+Math.sin(t*2.2)*0.004,org='50% 100%',zoom=1;
 if(type==='serious'){zoom=1+0.06*inn;org='50% 15%'}
 if(type==='thinking'){rot=-3*inn+Math.sin(t*1.2)*1.2*inn}
 if(type==='proud'){sy*=1+0.03*inn;sx*=1+0.02*inn}
 if(type==='excited'||type==='happy'){const j=Math.abs(Math.sin(t*(type==='excited'?7:5)));ty-=j*(type==='excited'?26:16)*inn;sy*=1+(1-j)*0.02*inn}
 if(type==='surprised'){zoom=1+0.55*eOut(clamp(k/.25))*(1-eOut(clamp((t-(e[1]-.3))/.3)));org='50% 9%';ty-=10*inn}
 if(type==='angry'){tx=Math.sin(t*38)*5*inn;zoom=1+0.05*inn;org='50% 15%'}
 if(type==='laugh'){tx=Math.sin(t*22)*4*inn;ty-=Math.abs(Math.sin(t*14))*8*inn;rot=Math.sin(t*11)*2*inn}
 const enter=eOut(prog(t,0,.6));
 const el=document.getElementById('pres');el.style.left=lerp(-200,380,enter)+'px';el.style.top='1048px';el.style.transformOrigin=org;
 el.style.transform=`translate(-50%,-100%) translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${sx*zoom},${sy*zoom})`;
 // aura behind presenter + reaction bubble near the head
 let h='';window._back='';
 if(e){window._back=at(380,520,`<div style="width:620px;height:900px;border-radius:50%;background:radial-gradient(rgba(${AURA[type]},.28),rgba(${AURA[type]},0) 65%)"></div>`,{o:inn});
   const p=pop(t,e[0]+.05,e[1]-.25);const wob=Math.sin(t*5)*4;
   const bx=type==='surprised'?690:600, by=type==='surprised'?230:150;
   h+=at(bx,by+wob,`<div style="position:relative;width:150px;height:150px;border-radius:50%;background:#fff;box-shadow:0 8px 24px rgba(31,22,15,.15);display:flex;align-items:center;justify-content:center;font-size:92px">${EMOJI[type]}<div style="position:absolute;left:-6px;bottom:6px;width:34px;height:34px;border-radius:50%;background:#fff"></div><div style="position:absolute;left:-30px;bottom:-14px;width:16px;height:16px;border-radius:50%;background:#fff"></div></div>`,p);
   if(type==='excited'||type==='proud')for(let i=0;i<5;i++){const a=t*2+i*1.25;h+=at(380+Math.cos(a)*230,330+Math.sin(a)*170,'<div style="font-size:40px">✨</div>',{o:inn*.9})}
   if(type==='surprised')h+=at(540,120,'<div style="font-size:90px;font-weight:900;color:#be5340">!</div>',p);
   if(type==='angry'){for(let i=0;i<3;i++)h+=at(250+i*40,120-i*10,`<div style="width:8px;height:${40+i*8}px;background:#be5340;border-radius:4px;transform:rotate(${-30+i*30}deg)"></div>`,{o:inn*(0.6+0.4*Math.sin(t*12))})}
   if(type==='laugh')h+=at(640,300+Math.sin(t*9)*6,'<div style="font-size:44px;font-weight:900;color:#d49700">HAHA !</div>',p);
   if(type==='thinking')for(let i=0;i<3;i++)h+=at(520+i*26,250-i*40,`<div style="width:${14+i*8}px;height:${14+i*8}px;border-radius:50%;background:#fff"></div>`,{o:inn})}
 return h}

function bg(t){let h='';
 h+=at(1500,330,`<div style="width:620px;height:620px;border-radius:50%;background:#e2d1b5"></div>`,{ty:Math.sin(t*.4)*10});
 h+=at(380,620,`<div style="width:560px;height:560px;border-radius:50%;background:#e5d6bd"></div>`,{ty:Math.cos(t*.35)*10});
 h+=`<div class="abs" style="top:1040px;width:1920px;height:40px;background:#a26f48"></div>`;
 for(let i=0;i<9;i++)h+=at(1700+(i%3)*22,180+Math.floor(i/3)*22,`<div style="width:8px;height:8px;border-radius:50%;background:#d4c6ad"></div>`);
 return h}

const X=1310; // content center
const SCENES=[
{s:0,e:3.35,f:t=>at(X,330,big('TES ÉTUDES','#1f160f',104),pop(t,.1))+at(X,460,big('<span class="hl">≠ EMPLOI GARANTI</span>','#1f160f',84),pop(t,1.0))+at(X,700,`<div style="position:relative">${card('',`<div style="font-size:30px;font-weight:800;color:#8a7a66;letter-spacing:3px">DIPLÔME</div><div style="font-size:56px;font-weight:900">🎓 Licence</div>`,380)}<div style="position:absolute;right:-26px;top:-26px">${cross()}</div></div>`,{...pop(t,1.6),r:-4})},
{s:3.35,e:7.7,f:t=>at(X,300,badge('','L\'HISTOIRE DE MOUSTAPHA',40),pop(t,3.6))+at(X,520,card('PROFIL',`<div style="font-size:54px;font-weight:900">⚖️ Étudiant en droit</div><div style="font-size:40px;font-weight:800;color:${C.orange};margin-top:6px">1re année</div>`,620),pop(t,wt('première',5)))},
{s:7.7,e:12.3,f:t=>{const a=wt('uniquement',10);return at(1040,420,card('SES CAMARADES',`<div style="font-size:90px;text-align:center">📚</div><div style="font-size:38px;font-weight:800;text-align:center">Études seulement</div>`,420),pop(t,8.0))+at(1580,420,card('MOUSTAPHA',`<div style="font-size:90px;text-align:center">📚 + ❓</div><div style="font-size:38px;font-weight:800;text-align:center;color:${C.orange}">Pas uniquement</div>`,420),pop(t,a))}},
{s:12.3,e:16.3,f:t=>at(X,300,chip('Une autre passion…','#fff',C.ink,44),pop(t,12.6))+at(X,560,`<div style="display:flex;align-items:center;gap:30px">${emo('💻',170)}${big('INFORMATIQUE',C.blue,96)}</div>`,pop(t,15.25))},
{s:16.3,e:24.5,f:t=>{let h='';
  const vid=`<div class="card" style="width:560px;padding:18px"><div style="height:280px;border-radius:18px;background:linear-gradient(135deg,#1f160f,#334155);display:flex;align-items:center;justify-content:center;position:relative"><div style="width:110px;height:78px;border-radius:22px;background:#ef4444;display:flex;align-items:center;justify-content:center"><div style="width:0;height:0;border-left:34px solid #fff;border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:8px"></div></div><div style="position:absolute;left:16px;right:16px;bottom:14px;height:8px;border-radius:4px;background:#475569"><div style="height:100%;width:${clamp((t-16.4)/8)*100}%;background:#ef4444;border-radius:4px"></div></div></div><div style="font-size:32px;font-weight:900;margin-top:14px">Tutoriel : réparer un téléphone</div><div style="font-size:26px;font-weight:700;color:#8a7a66">⏱ des heures de vidéos</div></div>`;
  h+=at(1000,430,vid,pop(t,16.5));
  const steps=[[wt('démonte',19),'🪛','Démonter'],[wt('comprendre',19),'🔍','Comprendre'],[wt('remonter',19),'🔧','Remonter']];
  steps.forEach(([ti,e,l],i)=>h+=at(1580,250+i*170,`<div class="card" style="display:flex;align-items:center;gap:20px;width:440px;padding:20px 28px"><span style="font-size:58px">${e}</span><span style="font-size:40px;font-weight:900">${l}</span></div>`,pop(t,ti)));
  return h}},
{s:24.5,e:35.5,f:t=>{let h='';
  if(t<27){h+=at(X,420,`<div style="display:flex;align-items:center;gap:24px">${emo('🤔',150)}${chip('Simple curiosité','#fff',C.ink,52)}</div>`,pop(t,24.8))}
  else if(t<30.5){h+=at(X,300,badge('','GÉNIE INFORMATIQUE',46),pop(t,wt('génie',27)));h+=at(X,560,`<div style="display:flex;align-items:center;gap:20px">${emo('🏠',150)}${chip('de la maison',C.amber,C.ink,48)}</div>`,pop(t,wt('maison',27)))}
  else{const D=[[30.7,'📱','Téléphones'],[31.5,'💻','Ordinateurs'],[32.4,'🖨️','Autres appareils']];
    D.forEach(([ti,e,l],i)=>h+=at(940+i*370,360,`<div class="card" style="text-align:center;width:320px"><div style="font-size:100px">${e}</div><div style="font-size:34px;font-weight:900">${l}</div><div style="margin-top:8px">${chip('En panne',t>wt('appel',33)?C.green:C.red,'#fff',26).replace('En panne',t>wt('appel',33)?'Réparé ✓':'En panne')}</div></div>`,pop(t,ti)));
    h+=at(X,640,chip('📞 « Appelle Moustapha ! »',C.blue,'#fff',42),pop(t,wt('appel',33)))}
  return h}},
{s:35.5,e:46.7,f:t=>{let h='';
  if(t<41.3){h+=at(X,250,chip('Et ce n\'est pas tout…','#fff',C.ink,40),pop(t,35.7));
    h+=at(X,520,`<div style="display:flex;align-items:center;gap:30px">${emo('🤖',170)}<div>${big('INTELLIGENCE',C.violet,84)}${big('ARTIFICIELLE',C.violet,84)}</div></div>`,pop(t,wt("l'intelligence",37)))}
